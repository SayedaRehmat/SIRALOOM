services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siraloom}
      POSTGRES_USER: ${POSTGRES_USER:-siraloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siraloom} -d ${POSTGRES_DB:-siraloom}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ${SIRALOOM_POSTGRES_HOST_PATH:-postgres_data}:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ${SIRALOOM_REDIS_HOST_PATH:-redis_data}:/data

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_admin_credentials
      TMPDIR: /data/siraloom/scratch
    secrets:
      - firebase_admin_credentials
    command: ["/app/scripts/start_api.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${SIRALOOM_ARTIFACT_HOST_PATH:-artifact_data}:/data/siraloom/artifacts
      - ${SIRALOOM_REFERENCE_HOST_PATH:-reference_data}:/data/references:ro
      - ${SIRALOOM_RESOURCE_CACHE_HOST_PATH:-resource_cache_data}:/data/siraloom/resource-cache
      - ${SIRALOOM_SCRATCH_HOST_PATH:-scratch_data}:/data/siraloom/scratch
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TMPDIR: /data/siraloom/scratch
    command: ["/app/scripts/start_worker.sh"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${SIRALOOM_ARTIFACT_HOST_PATH:-artifact_data}:/data/siraloom/artifacts
      - ${SIRALOOM_REFERENCE_HOST_PATH:-reference_data}:/data/references:ro
      - ${SIRALOOM_RESOURCE_CACHE_HOST_PATH:-resource_cache_data}:/data/siraloom/resource-cache

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SIRALOOM_API_BASE: ${NEXT_PUBLIC_SIRALOOM_API_BASE:?Set public API base URL, e.g. https://lab.example.org/api/v1}
        NEXT_PUBLIC_SIRALOOM_DEPLOYMENT_MODE: ${NEXT_PUBLIC_SIRALOOM_DEPLOYMENT_MODE:-lab}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?Set Firebase web API key}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?Set Firebase auth domain}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?Set Firebase project ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?Set Firebase web app ID}
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

secrets:
  firebase_admin_credentials:
    file: ${FIREBASE_ADMIN_CREDENTIALS_HOST_PATH:?Set path to Firebase Admin service-account JSON}

volumes:
  postgres_data:
  redis_data:
  artifact_data:
  reference_data:
  resource_cache_data:
  scratch_data:
