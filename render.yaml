services:
  - type: web
    name: siraloom-api
    runtime: docker
    plan: free
    dockerfilePath: .docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: staging

      - key: DATABASE_URL
        fromDatabase:
          name: siraloom-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: siraloom-redis
          property: connectionString

      - key: ARTIFACT_ROOT
        value: /tmp/siraloom/artifacts

      - key: FRONTEND_ORIGIN
        sync: false

      - key: PUBLIC_BASE_URL
        sync: false

      - key: FIREBASE_PROJECT_ID
        sync: false

      - key: FIREBASE_CREDENTIALS_PATH
        value: /etc/secrets/firebase-admin.json

      - key: FIREBASE_AUTH_REQUIRED
        value: "true"

      - key: FIREBASE_STORAGE_ENABLED
        value: "false"

      - key: GENEBE_ENABLED
        value: "true"

      - key: GENEBE_EMAIL
        sync: false

      - key: GENEBE_API_KEY
        sync: false

      - key: REFERENCE_REMOTE_ENABLED
        value: "true"

      - key: REFERENCE_REMOTE_GRCH38_ENDPOINT
        value: https://rest.ensembl.org

      - key: REFERENCE_REMOTE_GRCH37_ENDPOINT
        value: https://grch37.rest.ensembl.org

      - key: CELERY_CONCURRENCY
        value: "1"

      - key: SCHEDULER_LIGHT_CAPACITY
        value: "1"

      - key: SCHEDULER_STANDARD_CAPACITY
        value: "1"

      - key: SCHEDULER_HEAVY_CAPACITY
        value: "1"

  - type: keyvalue
    name: siraloom-redis
    plan: free

databases:
  - name: siraloom-db
    plan: free
    databaseName: siraloom
    user: siraloom
    postgresMajorVersion: "16"
