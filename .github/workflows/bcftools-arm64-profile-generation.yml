name: BCFtools native ARM64 profile generation

on:
  push:
    branches:
      - feat/multi-profile-arm64-qualification-20261108
  pull_request:
    paths:
      - "configs/bioinformatics/toolchain-profiles.v1.json"
      - "configs/bioinformatics/profiles/**"
      - "scripts/build_bcftools_from_profile.sh"
      - ".github/workflows/bcftools-arm64-profile-generation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bcftools-arm64-profile-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.profiles.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the three existing independent source-built profiles
        id: profiles
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          registry = json.loads(Path("configs/bioinformatics/toolchain-profiles.v1.json").read_text())
          expected_sources = {
              "bcftools-1.24.1-htslib-1.24.1-linux-64-source",
              "bcftools-1.23.3-htslib-1.23.3-linux-64-source",
              "bcftools-1.22.3-htslib-1.22.4-linux-64-source",
          }
          by_id = {profile["id"]: profile for profile in registry["profiles"]}
          selected = []
          for source_id in sorted(expected_sources):
              source = by_id.get(source_id)
              if source is None:
                  raise SystemExit(f"missing existing x86_64 source profile: {source_id}")
              if source.get("installation_method") != "verified_source_build" or source.get("status") != "SOFTWARE_QUALIFIED":
                  raise SystemExit(f"existing source profile is not software-qualified: {source_id}")
              if source.get("platform") != "linux-64" or not Path(source["lock_file"]).is_file():
                  raise SystemExit(f"existing x86_64 lock/profile is incomplete: {source_id}")
              if source.get("security_review", {}).get("status") != "PATCHED_UPSTREAM_RELEASE":
                  raise SystemExit(f"security review is not approved: {source_id}")
              arm_id = source_id.replace("linux-64-source", "linux-aarch64-source")
              candidate = by_id.get(arm_id)
              if candidate is None or candidate.get("status") != "CANDIDATE":
                  raise SystemExit(f"missing isolated ARM64 candidate profile: {arm_id}")
              if candidate.get("platform") != "linux-aarch64" or candidate.get("architecture_candidate_for") != source_id:
                  raise SystemExit(f"ARM64 candidate does not map to its x86_64 source profile: {arm_id}")
              if candidate.get("bcftools_version") != source.get("bcftools_version") or candidate.get("htslib_version") != source.get("htslib_version"):
                  raise SystemExit(f"ARM64 candidate version pair drifted from source profile: {arm_id}")
              if candidate.get("environment_file") != "configs/bioinformatics/profiles/bcftools-build-linux-aarch64.yml":
                  raise SystemExit(f"ARM64 candidate uses an unexpected build environment: {arm_id}")
              selected.append({
                  "id": candidate["id"],
                  "source_profile_id": source_id,
                  "bcftools_version": candidate["bcftools_version"],
                  "htslib_version": candidate["htslib_version"],
                  "worker_queue": candidate["worker_queue"],
                  "lock_file": candidate["lock_file"],
              })
          if len(selected) != 3:
              raise SystemExit("Exactly three independent ARM64 source-built candidates must be discovered.")
          print("matrix=" + json.dumps({"include": selected}, separators=(",", ":")))
          PY

  generate-and-qualify:
    needs: discover
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: configs/bioinformatics/profiles/bcftools-build-linux-aarch64.yml
          environment-name: bcftools-arm64-build
          cache-environment: false
          init-shell: bash
      - name: Assert native ARM64 runner and resolve architecture-specific explicit lock
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          lock="$RUNNER_TEMP/${{ matrix.id }}.lock"
          micromamba env export --explicit --name bcftools-arm64-build > "$lock"
          grep -Fqx '@EXPLICIT' "$lock"
          grep -Fqx '# platform: linux-aarch64' "$lock"
          test -s "$lock"
          echo "ARM64_LOCK=$lock" >> "$GITHUB_ENV"
          sha256sum "$lock"
      - name: Build the exact registered BCFtools and HTSlib source pair
        env:
          BCFTOOLS_PROFILE_ID: ${{ matrix.id }}
          BCFTOOLS_VERSION: ${{ matrix.bcftools_version }}
          HTSLIB_VERSION: ${{ matrix.htslib_version }}
          BCFTOOLS_PROFILE_REGISTRY: configs/bioinformatics/toolchain-profiles.v1.json
        run: |
          set -euo pipefail
          export BCFTOOLS_PREFIX="$MAMBA_ROOT_PREFIX/envs/bcftools-arm64-build"
          bash scripts/build_bcftools_from_profile.sh
      - name: Qualify reference-backed normalization, multiallelic splitting and CSI
        run: |
          set -euo pipefail
          BCFTOOLS_BIN="$MAMBA_ROOT_PREFIX/envs/bcftools-arm64-build/bin/bcftools"
          test -x "$BCFTOOLS_BIN"
          test "$(uname -m)" = "aarch64"
          work="$RUNNER_TEMP/bcftools-arm64-smoke"
          mkdir -p "$work"
          cat > "$work/ref.fa" <<'EOF'
          >chr1
          AAAAAAAAAACCCCCCCCCCGGGGGGGGGGTTTTTTTTTT
          EOF
          printf "chr1\\t40\\t6\\t40\\t41\\n" > "$work/ref.fa.fai"
          cat > "$work/input.vcf" <<'EOF'
          ##fileformat=VCFv4.2
          ##contig=<ID=chr1,length=40>
          #CHROM	POS	ID	REF	ALT	QUAL	FILTER	INFO
          chr1	11	.	C	CA,CAA	50	PASS	.
          EOF
          "$BCFTOOLS_BIN" norm -f "$work/ref.fa" -m -any -Oz -o "$work/normalized.vcf.gz" "$work/input.vcf"
          "$BCFTOOLS_BIN" index --csi "$work/normalized.vcf.gz"
          test "$("$BCFTOOLS_BIN" view -H "$work/normalized.vcf.gz" | wc -l)" -eq 2
          test -s "$work/normalized.vcf.gz.csi"
          test "$("$BCFTOOLS_BIN" --version | sed -n '1p')" = "bcftools ${{ matrix.bcftools_version }}"
          test "$("$BCFTOOLS_BIN" --version | sed -n '2p')" = "Using htslib ${{ matrix.htslib_version }}"
          ldd "$BCFTOOLS_BIN" | tee "$work/ldd.txt"
          ! grep -q "not found" "$work/ldd.txt"
      - name: Record native source-build qualification evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arm64-profile-output"
          cp "$ARM64_LOCK" "$RUNNER_TEMP/arm64-profile-output/"
          cat > "$RUNNER_TEMP/arm64-profile-output/qualification.txt" <<EOF
          profile_id=${{ matrix.id }}
          bcftools_version=${{ matrix.bcftools_version }}
          htslib_version=${{ matrix.htslib_version }}
          platform=linux-aarch64
          runner=ubuntu-24.04-arm
          uname=$(uname -m)
          source_build=passed
          reference_backed_normalization=passed
          multiallelic_split=passed
          bgzf_csi_index=passed
          shared_library_resolution=passed
          x86_64_profile_and_lock_modified=no
          container_image_qualification=pending
          EOF
          mkdir -p "$(dirname "${{ matrix.lock_file }}")"
          cp "$ARM64_LOCK" "${{ matrix.lock_file }}"
          sha256sum "$RUNNER_TEMP/arm64-profile-output/"*
      - uses: docker/setup-buildx-action@v3
      - name: Verify the pinned builder and runtime image digests include ARM64
        env:
          BUILDER_IMAGE: mambaorg/micromamba:2.3.1@sha256:6113627f42f39d065f116b8649e3f699ed2bbe076a58b64ae50fafb4acb8aaf3
          RUNTIME_IMAGE: python:3.12-slim-trixie@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$BUILDER_IMAGE" | tee "$RUNNER_TEMP/builder-manifest.txt"
          docker buildx imagetools inspect "$RUNTIME_IMAGE" | tee "$RUNNER_TEMP/runtime-manifest.txt"
          grep -Fq "linux/arm64" "$RUNNER_TEMP/builder-manifest.txt"
          grep -Fq "linux/arm64" "$RUNNER_TEMP/runtime-manifest.txt"
      - name: Build the immutable ARM64 worker image for this exact profile
        env:
          PROFILE_ID: ${{ matrix.id }}
          BCFTOOLS_VERSION: ${{ matrix.bcftools_version }}
          HTSLIB_VERSION: ${{ matrix.htslib_version }}
          WORKER_QUEUE: ${{ matrix.worker_queue }}
          BUILDER_IMAGE: mambaorg/micromamba:2.3.1@sha256:6113627f42f39d065f116b8649e3f699ed2bbe076a58b64ae50fafb4acb8aaf3
          RUNTIME_IMAGE: python:3.12-slim-trixie@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
        run: |
          set -euo pipefail
          image="siraloom/bcftools-arm64:$PROFILE_ID"
          registry=configs/bioinformatics/toolchain-profiles.v1.json
          backup="$RUNNER_TEMP/toolchain-profiles.arm64-qualification.json"
          cp "$registry" "$backup"
          trap 'cp "$backup" "$registry"' EXIT
          python - "$registry" "$PROFILE_ID" <<'PY'
          import json, sys
          path, profile_id = sys.argv[1:]
          payload = json.load(open(path, encoding="utf-8"))
          profile = next(item for item in payload["profiles"] if item["id"] == profile_id)
          if profile.get("status") != "CANDIDATE" or profile.get("platform") != "linux-aarch64":
              raise SystemExit("Only the registered ARM64 candidate may be promoted in this disposable image-build context.")
          profile["status"] = "SOFTWARE_QUALIFIED"
          profile["qualification_scope"] = "Disposable ARM64 image qualification context only; production registry remains CANDIDATE until reviewed evidence is committed."
          json.dump(payload, open(path, "w", encoding="utf-8"), indent=2)

          # The runtime resolver reads the scientific-tool registry, not the
          # build-matrix registry above. Promote the candidate only in this
          # disposable build context so the image can attest its own profile;
          # the checked-in production registry remains CANDIDATE.
          scientific_path = "configs/bioinformatics/scientific-tool-profiles.v1.json"
          scientific = json.load(open(scientific_path, encoding="utf-8"))
          matches = [item for item in scientific["profiles"] if item["id"] == profile_id]
          if len(matches) != 1:
              raise SystemExit(f"scientific tool registry must contain exactly one profile: {profile_id}")
          tool_profile = matches[0]
          if tool_profile.get("status") != "CANDIDATE":
              raise SystemExit("only an ARM64 candidate may be promoted in disposable image context")
          tool_profile["status"] = "SOFTWARE_QUALIFIED"
          tool_profile["qualification"]["status"] = "SOFTWARE_QUALIFIED"
          tool_profile["qualification"]["scope"] = (
              "Disposable ARM64 image qualification context only; production registry remains CANDIDATE."
          )
          json.dump(scientific, open(scientific_path, "w", encoding="utf-8"), indent=2)
          PY
          docker buildx build --platform linux/arm64 --load \
            --build-arg BCFTOOLS_BUILD_LOCK_FILE=${{ matrix.lock_file }} \
            --build-arg BCFTOOLS_PROFILE_ID="$PROFILE_ID" \
            --build-arg BCFTOOLS_VERSION="$BCFTOOLS_VERSION" \
            --build-arg HTSLIB_VERSION="$HTSLIB_VERSION" \
            --build-arg BCFTOOLS_WORKER_QUEUE="$WORKER_QUEUE" \
            --build-arg BCFTOOLS_PLATFORM=linux-aarch64 \
            --build-arg BCFTOOLS_BUILDER_IMAGE="$BUILDER_IMAGE" \
            --build-arg BCFTOOLS_BASE_IMAGE="$RUNTIME_IMAGE" \
            --file docker/backend-bcftools-source.Dockerfile \
            --tag "$image" .
          test "$(docker run --rm --platform linux/arm64 --entrypoint bcftools "$image" --version | sed -n '1p')" = "bcftools $BCFTOOLS_VERSION"
          test "$(docker run --rm --platform linux/arm64 --entrypoint bcftools "$image" --version | sed -n '2p')" = "Using htslib $HTSLIB_VERSION"
          test "$(docker run --rm --platform linux/arm64 --entrypoint sh "$image" -c 'id -u')" = "10001"
          docker run --rm --platform linux/arm64 --entrypoint python "$image" -c "from backend.app.domain.toolchain_profiles import resolve_registered_toolchain_profile; p=resolve_registered_toolchain_profile('$PROFILE_ID'); assert p['platform'] == 'linux-aarch64'; assert p['worker_queue'] == '$WORKER_QUEUE'"
          docker run --rm --platform linux/arm64 --entrypoint sh "$image" -c '
            set -eu
            work=$(mktemp -d)
            trap "rm -rf \"$work\"" EXIT
            printf ">chr1\\nAAAAAAAAAACCCCCCCCCCGGGGGGGGGGTTTTTTTTTT\\n" > "$work/ref.fa"
            printf "chr1\\t40\\t6\\t40\\t41\\n" > "$work/ref.fa.fai"
            printf "##fileformat=VCFv4.2\\n##contig=<ID=chr1,length=40>\\n#CHROM\\tPOS\\tID\\tREF\\tALT\\tQUAL\\tFILTER\\tINFO\\nchr1\\t11\\t.\\tC\\tCA,CAA\\t50\\tPASS\\t.\\n" > "$work/input.vcf"
            bcftools norm -f "$work/ref.fa" -m -any -Oz -o "$work/output.vcf.gz" "$work/input.vcf"
            bcftools index --csi "$work/output.vcf.gz"
            test "$(bcftools view -H "$work/output.vcf.gz" | wc -l)" -eq 2
            test -s "$work/output.vcf.gz.csi"
          '
          printf "container_image_qualification=passed\\nimage=%s\\n" "$image" >> "$RUNNER_TEMP/arm64-profile-output/qualification.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.id }}-linux-aarch64-profile-candidate
          path: ${{ runner.temp }}/arm64-profile-output/
          if-no-files-found: error
