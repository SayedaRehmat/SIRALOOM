name: SIRALOOM CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bcftools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bcftools
          test "$(bcftools --version | head -n1)" = "bcftools 1.19"
      - name: Install backend
        run: pip install -e . pytest
      - name: Backend tests
        env:
          DATABASE_URL: sqlite:///./ci.db
          REDIS_URL: redis://localhost:6379/0
          GENEBE_ENABLED: "false"
          GNOMAD_ENABLED: "false"
          FIREBASE_AUTH_REQUIRED: "false"
        run: pytest -q
      - name: Validate process startup scripts
        run: sh -n scripts/start_worker.sh scripts/start_beat.sh
      - name: Compile Python
        run: python -m compileall backend scripts

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siraloom
          POSTGRES_PASSWORD: siraloom
          POSTGRES_DB: siraloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siraloom -d siraloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e . pytest
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+psycopg://siraloom:siraloom@localhost:5432/siraloom
        run: alembic upgrade head
      - name: PostgreSQL and real Celery worker-loss integration tests
        env:
          DATABASE_URL: postgresql+psycopg://siraloom:siraloom@localhost:5432/siraloom
          REDIS_URL: redis://localhost:6379/1
          GENEBE_ENABLED: "false"
          GNOMAD_ENABLED: "false"
          FIREBASE_AUTH_REQUIRED: "false"
        run: pytest -q tests/integration/test_analysis_dispatch_postgres.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Localization architecture guard
        working-directory: frontend
        run: npm run validate:i18n
      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SIRALOOM_API_BASE: https://example.invalid/api/v1
          NEXT_PUBLIC_FIREBASE_API_KEY: demo
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_APP_ID: demo
        run: npm run build
