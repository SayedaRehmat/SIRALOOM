name: SIRALOOM CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: configs/bioinformatics/bcftools-environment.yml
          environment-name: bcftools
          cache-environment: true
          init-shell: bash
      - name: Verify pinned BCFtools/HTSlib
        run: |
          test "$(bcftools --version | sed -n '1p')" = "bcftools 1.25"
          test "$(bcftools --version | sed -n '2p')" = "Using htslib 1.25"
          test "$(bgzip --version | sed -n '1p')" = "bgzip (htslib) 1.25"
      - name: Install backend
        run: pip install -e . pytest
      - name: Extract source-pinned VCF normative-language candidates
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/hts-specs"
          mkdir -p "${source_dir}"
          for version in 4.1 4.2 4.3 4.4 4.5; do
            curl --fail --location --retry 3 --connect-timeout 30 --max-time 120 \
              "https://raw.githubusercontent.com/samtools/hts-specs/510c107ba89aa13113818c9e4fa3071283cb7f7b/VCFv${version}.tex" \
              --output "${source_dir}/VCFv${version}.tex"
          done
          PYTHONPATH=backend python -m app.domain.vcf_normative_inventory \
            --source-dir "${source_dir}" \
            --output "${RUNNER_TEMP}/vcf-normative-candidate-inventory.json"
      - name: Acquire NIST GIAB HG002 VCF and pinned Ensembl GRCh38 reference
        run: |
          set -euo pipefail
          data_dir="${RUNNER_TEMP}/siraloom-public-vcf"
          mkdir -p "${data_dir}"
          giab_base="https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/AshkenazimTrio/HG002_NA24385_son/NISTv4.2.1/GRCh38"
          giab_vcf="${data_dir}/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"
          giab_index="${giab_vcf}.tbi"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 900 \
            "${giab_base}/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz" --output "${giab_vcf}"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 180 \
            "${giab_base}/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz.tbi" --output "${giab_index}"
          test -s "${giab_vcf}" && test -s "${giab_index}"
          bcftools index --stats "${giab_vcf}" > "${data_dir}/giab-index-stats.txt"
          vcf_contig="$(bcftools view --header-only "${giab_vcf}" | sed -n 's/^##contig=<ID=\([^,>]*\).*/\1/p' | awk '$0 == "1" || $0 == "chr1" { print; exit }')"
          test -n "${vcf_contig}"
          slice="${data_dir}/giab-hg002-grch38-chr1.vcf.gz"
          bcftools view --no-version --regions "${vcf_contig}" --output-type z --output "${slice}" "${giab_vcf}"
          bcftools index --csi --force "${slice}"
          csi_magic="$(python -c 'import gzip,sys; print(gzip.open(sys.argv[1], "rb").read(4).hex())' "${slice}.csi")"
          test "${csi_magic}" = "43534901"
          source_records="$(bcftools view --no-header "${slice}" | wc -l)"
          test "${source_records}" -gt 0
          reference_name="Homo_sapiens.GRCh38.dna.chromosome.1.fa.gz"
          reference_archive="${data_dir}/${reference_name}"
          reference_checksums="${data_dir}/ENSEMBL_RELEASE_115_CHECKSUMS"
          reference_base="https://ftp.ensembl.org/pub/release-115/fasta/homo_sapiens/dna"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 300 \
            "${reference_base}/${reference_name}" --output "${reference_archive}"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 120 \
            "${reference_base}/CHECKSUMS" --output "${reference_checksums}"
          reference_official_sum="$(awk -v filename="${reference_name}" '{n=split($NF,path,"/"); if(path[n]==filename){print $1 " " $2; exit}}' "${reference_checksums}")"
          [[ "${reference_official_sum}" =~ ^[0-9]+[[:space:]]+[0-9]+$ ]]
          reference_actual_sum="$(sum "${reference_archive}" | awk '{print $1 " " $2}')"
          test "${reference_actual_sum}" = "${reference_official_sum}"
          reference_md5="$(md5sum "${reference_archive}" | awk '{print $1}')"
          echo "05d4d42ed292962055afb9774a1a29a691d7b285fd85dbf9069c050a273e0d3c  ${reference_archive}" | sha256sum --check -
          reference_fasta="${data_dir}/GRCh38.chr1.fa"
          gzip --decompress --stdout "${reference_archive}" > "${reference_fasta}"
          echo "SIRALOOM_PUBLIC_VCF_SLICE_PATH=${slice}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_VCF_ARCHIVE_PATH=${giab_vcf}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_VCF_INDEX_PATH=${giab_index}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_REFERENCE_ARCHIVE_PATH=${reference_archive}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_REFERENCE_CHECKSUMS_PATH=${reference_checksums}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_REFERENCE_MD5=${reference_md5}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_REFERENCE_PATH=${reference_fasta}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_REFERENCE_CONTIG=${vcf_contig}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_DATA_DIR=${data_dir}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_REFERENCE_SHA256_VERIFIED=1" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_BCFTOOLS_SHA256=$(sha256sum "$(command -v bcftools)" | awk '{print $1}')" >> "${GITHUB_ENV}"
      - name: Acquire NIST GIAB HG002 GRCh37 VCF and Ensembl release-75 chromosome 1 reference
        run: |
          set -euo pipefail
          data_dir="${RUNNER_TEMP}/siraloom-public-vcf-grch37"
          mkdir -p "${data_dir}"
          giab_base="https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/AshkenazimTrio/HG002_NA24385_son/NISTv4.2.1/GRCh37"
          giab_vcf="${data_dir}/HG002_GRCh37_1_22_v4.2.1_benchmark.vcf.gz"
          giab_index="${giab_vcf}.tbi"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 900 \
            "${giab_base}/HG002_GRCh37_1_22_v4.2.1_benchmark.vcf.gz" --output "${giab_vcf}"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 180 \
            "${giab_base}/HG002_GRCh37_1_22_v4.2.1_benchmark.vcf.gz.tbi" --output "${giab_index}"
          test -s "${giab_vcf}" && test -s "${giab_index}"
          bcftools index --stats "${giab_vcf}" > "${data_dir}/giab-grch37-index-stats.txt"
          vcf_contig="$(bcftools view --header-only "${giab_vcf}" | sed -n 's/^##contig=<ID=\([^,>]*\).*/\1/p' | awk '$0 == "1" || $0 == "chr1" { print; exit }')"
          test -n "${vcf_contig}"
          slice="${data_dir}/giab-hg002-grch37-chr1.vcf.gz"
          bcftools view --no-version --regions "${vcf_contig}" --output-type z --output "${slice}" "${giab_vcf}"
          bcftools index --csi --force "${slice}"
          csi_magic="$(python -c 'import gzip,sys; print(gzip.open(sys.argv[1], "rb").read(4).hex())' "${slice}.csi")"
          test "${csi_magic}" = "43534901"
          source_records="$(bcftools view --no-header "${slice}" | wc -l)"
          test "${source_records}" -gt 0

          reference_name="Homo_sapiens.GRCh37.75.dna.chromosome.1.fa.gz"
          reference_base="https://ftp.ensembl.org/pub/release-75/fasta/homo_sapiens/dna"
          reference_archive="${data_dir}/${reference_name}"
          checksum_manifest="${data_dir}/ENSEMBL_RELEASE_75_CHECKSUMS"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 300 \
            "${reference_base}/${reference_name}" --output "${reference_archive}"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 120 \
            "${reference_base}/CHECKSUMS" --output "${checksum_manifest}"
          reference_official_sum="$(awk -v filename="${reference_name}" '{n=split($NF,path,"/"); if(path[n]==filename){print $1 " " $2; exit}}' "${checksum_manifest}")"
          [[ "${reference_official_sum}" =~ ^[0-9]+[[:space:]]+[0-9]+$ ]]
          reference_actual_sum="$(sum "${reference_archive}" | awk '{print $1 " " $2}')"
          test "${reference_actual_sum}" = "${reference_official_sum}"
          reference_md5="$(md5sum "${reference_archive}" | awk '{print $1}')"
          reference_sha256="$(sha256sum "${reference_archive}" | awk '{print $1}')"
          giab_sha256="$(sha256sum "${giab_vcf}" | awk '{print $1}')"
          giab_index_sha256="$(sha256sum "${giab_index}" | awk '{print $1}')"
          reference_fasta="${data_dir}/GRCh37.chr1.fa"
          gzip --decompress --stdout "${reference_archive}" > "${reference_fasta}"

          echo "SIRALOOM_PUBLIC_GRCH37_VCF_SLICE_PATH=${slice}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_GRCH37_VCF_ARCHIVE_PATH=${giab_vcf}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_GRCH37_VCF_INDEX_PATH=${giab_index}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_GRCH37_REFERENCE_ARCHIVE_PATH=${reference_archive}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_GRCH37_REFERENCE_PATH=${reference_fasta}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_GRCH37_REFERENCE_CHECKSUMS_PATH=${checksum_manifest}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_GRCH37_REFERENCE_CONTIG=${vcf_contig}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_GRCH37_DATA_DIR=${data_dir}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_GRCH37_VCF_SHA256=${giab_sha256}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_GRCH37_VCF_INDEX_SHA256=${giab_index_sha256}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_GRCH37_REFERENCE_SHA256=${reference_sha256}" >> "${GITHUB_ENV}"
          echo "SIRALOOM_PUBLIC_GRCH37_REFERENCE_MD5=${reference_md5}" >> "${GITHUB_ENV}"
      - name: Backend tests
        env:
          DATABASE_URL: sqlite:///./ci.db
          REDIS_URL: redis://localhost:6379/0
          GENEBE_ENABLED: "false"
          GNOMAD_ENABLED: "false"
          FIREBASE_AUTH_REQUIRED: "false"
        run: pytest -q
      - name: Qualify supported BCFtools releases against the real GIAB HG002 VCF
        run: |
          set -euo pipefail
          data_dir="${RUNNER_TEMP}/siraloom-public-vcf"

          qualify_executable() {
            local version="$1"
            local htslib_version="$2"
            local executable="$3"
            local provenance="$4"
            local version_output
            local executable_sha256
            local evidence_dir

            version_output="$("${executable}" --version)"
            test "$(printf '%s\n' "${version_output}" | sed -n '1p')" = "bcftools ${version}"
            test "$(printf '%s\n' "${version_output}" | sed -n '2p')" = "Using htslib ${htslib_version}"
            executable_sha256="$(sha256sum "${executable}" | awk '{print $1}')"

            BCFTOOLS_VERSION="${version}" \
            HTSLIB_VERSION="${htslib_version}" \
            SIRALOOM_PUBLIC_BCFTOOLS_EXECUTABLE="${executable}" \
            SIRALOOM_PUBLIC_BCFTOOLS_VERSION="${version}" \
            SIRALOOM_PUBLIC_BCFTOOLS_SHA256="${executable_sha256}" \
            PATH="$(dirname "${executable}"):${PATH}" \
              pytest -q tests/test_public_vcf_normalization.py
            evidence_dir="${data_dir}/bcftools-${version}"
            mkdir -p "${evidence_dir}"
            printf '%s\n' "${version_output}" > "${evidence_dir}/version.txt"
            printf '%s\n' "${provenance}" > "${evidence_dir}/build-provenance.txt"
            printf '%s  %s\n' "${executable_sha256}" "${executable}" > "${evidence_dir}/bcftools-executable.sha256"
            cp "${data_dir}/qualification-report.json" "${evidence_dir}/qualification-report-grch38.json"
            cp "${data_dir}/giab-hg002-grch38-chr1.normalized.vcf.gz" "${evidence_dir}/normalized-grch38.vcf.gz"
            cp "${data_dir}/giab-hg002-grch38-chr1.normalized.vcf.gz.csi" "${evidence_dir}/normalized-grch38.vcf.gz.csi"
            grch37_dir="${RUNNER_TEMP}/siraloom-public-vcf-grch37"
            cp "${grch37_dir}/qualification-report-grch37.json" "${evidence_dir}/qualification-report-grch37.json"
            cp "${grch37_dir}/giab-hg002-grch37-chr1.normalized.vcf.gz" "${evidence_dir}/normalized-grch37.vcf.gz"
            cp "${grch37_dir}/giab-hg002-grch37-chr1.normalized.vcf.gz.csi" "${evidence_dir}/normalized-grch37.vcf.gz.csi"
          }

          # Bioconda publishes binary builds for these releases.
          for version in 1.23.1 1.24 1.25; do
            environment="bcftools-${version}"
            micromamba create --yes --name "${environment}" \
              --channel conda-forge --channel bioconda --strict-channel-priority \
              "bcftools=${version}"
            executable="${MAMBA_ROOT_PREFIX}/envs/${environment}/bin/bcftools"
            test -x "${executable}"
            package_manifest="$(micromamba list -n "${environment}")"
            case "${version}" in
              1.23.1) htslib_version="1.24" ;;
              1.24) htslib_version="1.24" ;;
              1.25) htslib_version="1.25" ;;
              *) echo "No pinned Bioconda BCFtools/HTSlib pair for ${version}" >&2; exit 1 ;;
            esac
            qualify_executable "${version}" "${htslib_version}" "${executable}" "Bioconda package"
            printf '%s\n' "${package_manifest}" > "${data_dir}/bcftools-${version}/package-manifest.txt"
          done

          # Build upstream stable releases that do not have Bioconda binaries
          # from matching, exact BCFtools and HTSlib release tags.
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake build-essential gcc make perl \
            zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev libssl-dev

          for version in 1.23.2 1.23.3 1.24.1; do
            source_root="${RUNNER_TEMP}/bcftools-source-${version}"
            install_root="${RUNNER_TEMP}/bcftools-install-${version}"
            mkdir -p "${source_root}"

            # Resolve immutable source pins before any compilation. The HTSlib
            # release embeds htscodecs as a git submodule; a shallow parent
            # clone without submodule initialization produces an incomplete
            # source tree and fails during the HTSlib object-file build.
            case "${version}" in
              1.23.2)
                expected_bcftools_commit="db87bf9833f06a5cde792a5118a0a83d2860a179"
                expected_htslib_commit="3beae100a4c6b066e7f601f7e244bb371b9c1c16"
                ;;
              1.23.3)
                expected_bcftools_commit="ec74c62952f53c14459acb5283a7483b41c4ade3"
                expected_htslib_commit="02594b767d74e7992971d286a79dc2b60a7b9257"
                ;;
              1.24.1)
                expected_bcftools_commit="2fd5931cdf3a7ef27ab843dda27da844b4ea2a51"
                expected_htslib_commit="a6962b2d8d748d699258eb1def48d770544f73e2"
                ;;
              *)
                echo "No immutable upstream source pin for BCFtools ${version}" >&2
                exit 1
                ;;
            esac

            git init "${source_root}/htslib"
            git -C "${source_root}/htslib" remote add origin https://github.com/samtools/htslib.git
            git -C "${source_root}/htslib" fetch --depth 1 origin "${expected_htslib_commit}"
            git -C "${source_root}/htslib" checkout --detach FETCH_HEAD
            test "$(git -C "${source_root}/htslib" rev-parse HEAD)" = "${expected_htslib_commit}"
            git -C "${source_root}/htslib" submodule update --init --recursive --depth 1
            htscodecs_commit="$(git -C "${source_root}/htslib/htscodecs" rev-parse HEAD)"
            expected_htscodecs_commit="b9fc194f772e45bb0a1f44b08cbf8697a1384bae"
            test "${htscodecs_commit}" = "${expected_htscodecs_commit}"

            git init "${source_root}/bcftools"
            git -C "${source_root}/bcftools" remote add origin https://github.com/samtools/bcftools.git
            git -C "${source_root}/bcftools" fetch --depth 1 origin "${expected_bcftools_commit}"
            git -C "${source_root}/bcftools" checkout --detach FETCH_HEAD
            bcftools_commit="$(git -C "${source_root}/bcftools" rev-parse HEAD)"
            test "${bcftools_commit}" = "${expected_bcftools_commit}"

            pushd "${source_root}/bcftools"
            if [[ ! -x ./configure ]]; then
              autoheader
              autoconf
            fi
            ./configure --prefix="${install_root}" --with-htslib="${source_root}/htslib"
            make --jobs=2
            make install
            popd
            export LD_LIBRARY_PATH="${source_root}/htslib:${install_root}/lib:${LD_LIBRARY_PATH:-}"
            qualify_executable "${version}" "${version}" "${install_root}/bin/bcftools" \
              "Pinned upstream BCFtools commit ${bcftools_commit}; pinned HTSlib commit ${expected_htslib_commit}; pinned htscodecs commit ${htscodecs_commit}"
          done
      - name: Preserve public VCF normalization qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siraloom-public-vcf-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/siraloom-public-vcf/qualification-report*.json
            ${{ runner.temp }}/siraloom-public-vcf/bcftools-*/
            ${{ runner.temp }}/vcf-normative-candidate-inventory.json
            ${{ runner.temp }}/siraloom-public-vcf/giab-hg002-grch38-chr1.normalized.vcf.gz
            ${{ runner.temp }}/siraloom-public-vcf/giab-hg002-grch38-chr1.normalized.vcf.gz.csi
            ${{ runner.temp }}/siraloom-public-vcf/giab-index-stats.txt
            ${{ runner.temp }}/siraloom-public-vcf/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz
            ${{ runner.temp }}/siraloom-public-vcf/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz.tbi
            ${{ runner.temp }}/siraloom-public-vcf/giab-hg002-grch38-chr1.vcf.gz
            ${{ runner.temp }}/siraloom-public-vcf/giab-hg002-grch38-chr1.vcf.gz.csi
            ${{ runner.temp }}/siraloom-public-vcf/Homo_sapiens.GRCh38.dna.chromosome.1.fa.gz
            ${{ runner.temp }}/siraloom-public-vcf/ENSEMBL_RELEASE_115_CHECKSUMS
            ${{ runner.temp }}/siraloom-public-vcf/GRCh38.chr1.fa
            ${{ runner.temp }}/siraloom-public-vcf/GRCh38.reference-for-chr1.fa
            ${{ runner.temp }}/siraloom-public-vcf/GRCh38.reference-for-chr1.fa.fai
            ${{ runner.temp }}/siraloom-public-vcf-grch37/HG002_GRCh37_1_22_v4.2.1_benchmark.vcf.gz
            ${{ runner.temp }}/siraloom-public-vcf-grch37/HG002_GRCh37_1_22_v4.2.1_benchmark.vcf.gz.tbi
            ${{ runner.temp }}/siraloom-public-vcf-grch37/giab-hg002-grch37-chr1.vcf.gz
            ${{ runner.temp }}/siraloom-public-vcf-grch37/giab-hg002-grch37-chr1.vcf.gz.csi
            ${{ runner.temp }}/siraloom-public-vcf-grch37/Homo_sapiens.GRCh37.75.dna.chromosome.1.fa.gz
            ${{ runner.temp }}/siraloom-public-vcf-grch37/ENSEMBL_RELEASE_75_CHECKSUMS
            ${{ runner.temp }}/siraloom-public-vcf-grch37/GRCh37.chr1.fa
            ${{ runner.temp }}/siraloom-public-vcf-grch37/GRCh37.chr1.fa.fai
            ${{ runner.temp }}/siraloom-public-vcf-grch37/qualification-report-grch37.json
            ${{ runner.temp }}/siraloom-public-vcf-grch37/giab-hg002-grch37-chr1.normalized.vcf.gz
            ${{ runner.temp }}/siraloom-public-vcf-grch37/giab-hg002-grch37-chr1.normalized.vcf.gz.csi
            ${{ runner.temp }}/siraloom-public-vcf-grch37/giab-grch37-index-stats.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Validate process startup scripts
        run: sh -n scripts/start_worker.sh scripts/start_beat.sh
      - name: Compile Python
        run: python -m compileall backend scripts
      - name: Build laboratory backend image
        run: docker build --file docker/backend.Dockerfile --tag siraloom-backend:ci .
      - name: Verify backend image runs without root privileges
        run: |
          test "$(docker run --rm --entrypoint id siraloom-backend:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint id siraloom-backend:ci -g)" = "10001"
          docker run --rm --entrypoint sh siraloom-backend:ci -c \
            'test -w /data/siraloom/artifacts && test -w /data/siraloom/resource-cache && test -w /data/siraloom/scratch && test -w /data/siraloom/beat'
      - name: Verify writable ownership of fresh backend named volumes
        run: |
          set -eu
          for directory in artifacts resource-cache scratch beat; do
            volume="siraloom-ci-${directory}"
            docker volume create "$volume"
            docker run --rm -v "$volume:/data/siraloom/$directory" \
              --entrypoint sh siraloom-backend:ci -c "test -w /data/siraloom/$directory"
            docker volume rm "$volume"
          done
      - name: Verify container BCFtools version
        run: |
          test "$(docker run --rm --entrypoint bcftools siraloom-backend:ci --version | sed -n '1p')" = "bcftools 1.25"
          test "$(docker run --rm --entrypoint bcftools siraloom-backend:ci --version | sed -n '2p')" = "Using htslib 1.25"
      - name: Execute real GRCh38 and GRCh37 GIAB normalization inside the production container
        env:
          BCFTOOLS_VERSION: "1.25"
          HTSLIB_VERSION: "1.25"
        run: |
          set -euo pipefail
          grch38_reference="$(find "${SIRALOOM_PUBLIC_DATA_DIR}" -maxdepth 1 -name 'GRCh38.reference-for-*.fa' -print -quit)"
          grch37_reference="${SIRALOOM_PUBLIC_GRCH37_REFERENCE_PATH}"
          test -s "${SIRALOOM_PUBLIC_DATA_DIR}/giab-hg002-grch38-chr1.vcf.gz"
          test -s "${SIRALOOM_PUBLIC_DATA_DIR}/giab-hg002-grch38-chr1.vcf.gz.csi"
          test -s "${grch38_reference}"
          test -s "${grch38_reference}.fai"
          test -s "${SIRALOOM_PUBLIC_GRCH37_DATA_DIR}/giab-hg002-grch37-chr1.vcf.gz"
          test -s "${SIRALOOM_PUBLIC_GRCH37_DATA_DIR}/giab-hg002-grch37-chr1.vcf.gz.csi"
          test -s "${grch37_reference}"
          test -s "${grch37_reference}.fai"
          output_dir="${RUNNER_TEMP}/siraloom-container-qualification"
          mkdir -p "${output_dir}"
          chmod 0777 "${output_dir}"
          qualification_script="${RUNNER_TEMP}/siraloom-container-qualification.py"
          cat > "${qualification_script}" <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          from backend.app.domain.ingestion import validate_vcf
          from backend.app.domain.vcf_tools import (
              normalize_vcf_with_bcftools,
              route_vcf_records,
              validate_vcf_index_concordance,
          )
          from backend.app.domain.vcf_validation import validate_vcf_strict

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          executable = shutil.which("bcftools")
          if not executable:
              raise SystemExit("Production container has no BCFtools executable")
          executable_sha256 = sha256(Path(executable))
          output_dir = Path("/qualification/output")
          output_dir.mkdir(parents=True, exist_ok=True)
          cases = [
              (
                  "GRCh38",
                  Path("/qualification/grch38/giab-hg002-grch38-chr1.vcf.gz"),
                  Path("/qualification/grch38") / os.environ["GRCH38_REFERENCE_FILENAME"],
                  "chr1",
              ),
              (
                  "GRCh37",
                  Path("/qualification/grch37/giab-hg002-grch37-chr1.vcf.gz"),
                  Path("/qualification/grch37") / os.environ["GRCH37_REFERENCE_FILENAME"],
                  "1",
              ),
          ]
          reports = []
          for build, source, reference, contig in cases:
              if not source.is_file() or not reference.is_file() or not Path(f"{reference}.fai").is_file():
                  raise SystemExit(f"{build} input or reference/FAI is missing inside the container")
              intake = validate_vcf(source)
              if intake.status != "VALID":
                  raise SystemExit(f"{build} production-container VCF intake failed: {intake.errors}")
              source_index = validate_vcf_index_concordance(
                  source,
                  expected_bcftools_version="1.25",
              )
              routing = route_vcf_records(
                  source,
                  output_dir / f"{build.lower()}-routing",
              )
              if routing["record_reconciliation"]["balanced"] is not True:
                  raise SystemExit(f"{build} source-record routing reconciliation failed")
              sequence_input = Path(routing["sequence_path"])
              output = output_dir / f"normalized-{build.lower()}.vcf.gz"
              result = normalize_vcf_with_bcftools(
                  sequence_input,
                  output,
                  reference_fasta=reference,
                  expected_bcftools_version="1.25",
                  expected_bcftools_sha256=executable_sha256,
              )
              normalized = validate_vcf_strict(output, reference_contigs={contig})
              index = validate_vcf_index_concordance(
                  output,
                  expected_bcftools_version="1.25",
              )
              if result["source_child_reconciliation"]["balanced"] is not True:
                  raise SystemExit(f"{build} source-to-child reconciliation failed")
              if index["status"] != "VALIDATED":
                  raise SystemExit(f"{build} normalized CSI validation failed")
              reports.append({
                  "genome_build": build,
                  "input_vcf_sha256": sha256(source),
                  "reference_fasta_sha256": sha256(reference),
                  "reference_fai_sha256": sha256(Path(f"{reference}.fai")),
                  "input_validation": {
                      "status": intake.status,
                      "record_count": intake.record_count,
                      "fileformat": intake.fileformat,
                      "bcftools_version": intake.metadata["bcftools_version"],
                      "htslib_version": intake.metadata["htslib_version"],
                  },
                  "input_index_validation": source_index,
                  "record_routing": {
                      "record_reconciliation": routing["record_reconciliation"],
                      "sequence_records": routing["sequence_records"],
                      "structural_variant_records": routing["structural_variant_records"],
                      "cnv_variant_records": routing["cnv_variant_records"],
                      "repeat_expansion_records": routing["repeat_expansion_records"],
                  },
                  "normalization": {
                      "tool_version": result["tool_version"],
                      "executable_sha256": result["executable_sha256"],
                      "normalized_record_count": normalized["records"],
                      "normalized_vcf_sha256": sha256(output),
                      "normalized_csi_sha256": sha256(Path(f"{output}.csi")),
                      "source_child_reconciliation": result["source_child_reconciliation"],
                      "index_validation": index,
                  },
              })
          report = {
              "qualification_status": "PASSED",
              "execution_environment": "siraloom-backend:ci",
              "container_user": os.getuid(),
              "bcftools_executable": executable,
              "bcftools_executable_sha256": executable_sha256,
              "bcftools_version": "1.25",
              "htslib_version": "1.25",
              "assemblies": reports,
          }
          (output_dir / "container-qualification-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          docker run --rm \
            --mount "type=bind,src=${SIRALOOM_PUBLIC_DATA_DIR},dst=/qualification/grch38,readonly" \
            --mount "type=bind,src=${SIRALOOM_PUBLIC_GRCH37_DATA_DIR},dst=/qualification/grch37,readonly" \
            --mount "type=bind,src=${output_dir},dst=/qualification/output" \
            --mount "type=bind,src=${qualification_script},dst=/qualification/qualify.py,readonly" \
            -e BCFTOOLS_VERSION=1.25 \
            -e HTSLIB_VERSION=1.25 \
            -e GRCH38_REFERENCE_FILENAME="$(basename "${grch38_reference}")" \
            -e GRCH37_REFERENCE_FILENAME="$(basename "${grch37_reference}")" \
            --entrypoint python \
            siraloom-backend:ci /qualification/qualify.py
      - name: Preserve production-container GIAB qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siraloom-production-container-giab-qualification
          path: ${{ runner.temp }}/siraloom-container-qualification/*
          if-no-files-found: warn
          retention-days: 7

  postgres-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siraloom
          POSTGRES_PASSWORD: siraloom
          POSTGRES_DB: siraloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siraloom -d siraloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: configs/bioinformatics/bcftools-environment.yml
          environment-name: bcftools
          cache-environment: true
          init-shell: bash
      - name: Verify pinned BCFtools/HTSlib for PostgreSQL workflow integration
        run: |
          test "$(bcftools --version | sed -n '1p')" = "bcftools 1.25"
          test "$(bcftools --version | sed -n '2p')" = "Using htslib 1.25"
      - name: Install backend
        run: pip install -e . pytest
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+psycopg://siraloom:siraloom@localhost:5432/siraloom
        run: alembic upgrade head
      - name: PostgreSQL and real Celery worker-loss integration tests
        env:
          DATABASE_URL: postgresql+psycopg://siraloom:siraloom@localhost:5432/siraloom
          REDIS_URL: redis://localhost:6379/1
          GENEBE_ENABLED: "false"
          GNOMAD_ENABLED: "false"
          FIREBASE_AUTH_REQUIRED: "false"
        run: pytest -q tests/integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend behavior tests
        working-directory: frontend
        run: npm run test:session
      - name: Localization architecture guard
        working-directory: frontend
        run: npm run validate:i18n
      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SIRALOOM_API_BASE: https://example.invalid/api/v1
          NEXT_PUBLIC_FIREBASE_API_KEY: demo
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_APP_ID: demo
        run: npm run build
      - name: Build production frontend container
        working-directory: .
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_SIRALOOM_API_BASE=https://example.invalid/api/v1 \
            --build-arg NEXT_PUBLIC_SIRALOOM_DEPLOYMENT_MODE=lab \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=ci-demo \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-demo.firebaseapp.com \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-demo \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-demo.firebasestorage.app \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=ci-demo \
            -t siraloom-frontend:ci .
      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password
          REDIS_PASSWORD: ci-only-redis-password
          FIREBASE_ADMIN_CREDENTIALS_HOST_PATH: /tmp/siraloom-firebase-admin.json
          NEXT_PUBLIC_SIRALOOM_API_BASE: https://example.invalid/api/v1
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-demo
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-demo.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-demo
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-demo
        run: |
          cp .env.production.example .env
          touch /tmp/siraloom-firebase-admin.json
          docker compose -f docker-compose.production.yml config --quiet
          SIRALOOM_LAB_A_ARTIFACT_HOST_PATH=/tmp/siraloom-lab-a-artifacts \
            SIRALOOM_LAB_B_ARTIFACT_HOST_PATH=/tmp/siraloom-lab-b-artifacts \
            docker compose -f docker-compose.production.yml \
              -f deployment/storage-targets-local.compose.example.yml config --quiet
