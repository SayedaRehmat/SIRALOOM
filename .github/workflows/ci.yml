name: SIRALOOM CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: configs/bioinformatics/bcftools-environment.yml
          environment-name: bcftools
          cache-environment: true
          init-shell: bash
      - name: Verify pinned BCFtools/HTSlib
        run: |
          test "$(bcftools --version | sed -n '1p')" = "bcftools 1.25"
          test "$(bcftools --version | sed -n '2p')" = "Using htslib 1.25"
      - name: Install backend
        run: pip install -e . pytest
      - name: Backend tests
        env:
          DATABASE_URL: sqlite:///./ci.db
          REDIS_URL: redis://localhost:6379/0
          GENEBE_ENABLED: "false"
          GNOMAD_ENABLED: "false"
          FIREBASE_AUTH_REQUIRED: "false"
        run: pytest -q
      - name: Validate process startup scripts
        run: sh -n scripts/start_worker.sh scripts/start_beat.sh
      - name: Compile Python
        run: python -m compileall backend scripts
      - name: Build laboratory backend image
        run: docker build --file docker/backend.Dockerfile --tag siraloom-backend:ci .
      - name: Verify backend image runs without root privileges
        run: |
          test "$(docker run --rm --entrypoint id siraloom-backend:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint id siraloom-backend:ci -g)" = "10001"
          docker run --rm --entrypoint sh siraloom-backend:ci -c \
            'test -w /data/siraloom/artifacts && test -w /data/siraloom/resource-cache && test -w /data/siraloom/scratch && test -w /data/siraloom/beat'
      - name: Verify writable ownership of fresh backend named volumes
        run: |
          set -eu
          for directory in artifacts resource-cache scratch beat; do
            volume="siraloom-ci-${directory}"
            docker volume create "$volume"
            docker run --rm -v "$volume:/data/siraloom/$directory" \
              --entrypoint sh siraloom-backend:ci -c "test -w /data/siraloom/$directory"
            docker volume rm "$volume"
          done
      - name: Verify container BCFtools version
        run: |
          test "$(docker run --rm --entrypoint bcftools siraloom-backend:ci --version | sed -n '1p')" = "bcftools 1.25"
          test "$(docker run --rm --entrypoint bcftools siraloom-backend:ci --version | sed -n '2p')" = "Using htslib 1.25"

  postgres-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siraloom
          POSTGRES_PASSWORD: siraloom
          POSTGRES_DB: siraloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siraloom -d siraloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: configs/bioinformatics/bcftools-environment.yml
          environment-name: bcftools
          cache-environment: true
          init-shell: bash
      - name: Verify pinned BCFtools/HTSlib for PostgreSQL workflow integration
        run: |
          test "$(bcftools --version | sed -n '1p')" = "bcftools 1.25"
          test "$(bcftools --version | sed -n '2p')" = "Using htslib 1.25"
      - name: Install backend
        run: pip install -e . pytest
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+psycopg://siraloom:siraloom@localhost:5432/siraloom
        run: alembic upgrade head
      - name: PostgreSQL and real Celery worker-loss integration tests
        env:
          DATABASE_URL: postgresql+psycopg://siraloom:siraloom@localhost:5432/siraloom
          REDIS_URL: redis://localhost:6379/1
          GENEBE_ENABLED: "false"
          GNOMAD_ENABLED: "false"
          FIREBASE_AUTH_REQUIRED: "false"
        run: pytest -q tests/integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend behavior tests
        working-directory: frontend
        run: npm run test:session
      - name: Localization architecture guard
        working-directory: frontend
        run: npm run validate:i18n
      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SIRALOOM_API_BASE: https://example.invalid/api/v1
          NEXT_PUBLIC_FIREBASE_API_KEY: demo
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_APP_ID: demo
        run: npm run build
      - name: Build production frontend container
        working-directory: .
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_SIRALOOM_API_BASE=https://example.invalid/api/v1 \
            --build-arg NEXT_PUBLIC_SIRALOOM_DEPLOYMENT_MODE=lab \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=ci-demo \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-demo.firebaseapp.com \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-demo \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-demo.firebasestorage.app \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=ci-demo \
            -t siraloom-frontend:ci .
      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password
          REDIS_PASSWORD: ci-only-redis-password
          FIREBASE_ADMIN_CREDENTIALS_HOST_PATH: /tmp/siraloom-firebase-admin.json
          NEXT_PUBLIC_SIRALOOM_API_BASE: https://example.invalid/api/v1
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-demo
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-demo.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-demo
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-demo
        run: |
          cp .env.production.example .env
          touch /tmp/siraloom-firebase-admin.json
          docker compose -f docker-compose.production.yml config --quiet
          SIRALOOM_LAB_A_ARTIFACT_HOST_PATH=/tmp/siraloom-lab-a-artifacts \
            SIRALOOM_LAB_B_ARTIFACT_HOST_PATH=/tmp/siraloom-lab-b-artifacts \
            docker compose -f docker-compose.production.yml \
              -f deployment/storage-targets-local.compose.example.yml config --quiet

  public-giab-qualification:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/giab-public-benchmark-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        build: [GRCh38, GRCh37]
    env:
      PYTHONUNBUFFERED: "1"
      SIRALOOM_BENCHMARK_SAMPLE_NAME: HG001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: configs/bioinformatics/bcftools-environment.yml
          environment-name: bcftools
          cache-environment: true
          init-shell: bash
      - name: Install SIRALOOM backend
        shell: bash -l {0}
        run: pip install -e .
      - name: Acquire pinned public assets
        shell: bash -l {0}
        run: |
          set -euo pipefail
          python scripts/validation/acquire_giab_public_assets.py \
            --manifest benchmarks/giab/public_assets.v1.json \
            --build "${{ matrix.build }}" \
            --output-dir "$RUNNER_TEMP/giab-${{ matrix.build }}/assets" \
            --provenance-out "$RUNNER_TEMP/giab-${{ matrix.build }}/asset-provenance.json"
      - name: Verify FASTA, FAI and GZI
        shell: bash -l {0}
        run: |
          set -euo pipefail
          PROVENANCE="$RUNNER_TEMP/giab-${{ matrix.build }}/asset-provenance.json"
          FASTA="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["assets"]["reference_fasta"]["path"])' "$PROVENANCE")"
          python - "$FASTA" <<'PY'
          import sys
          from pathlib import Path
          from backend.app.domain.reference_package import validate_fasta_index_consistency
          fasta=Path(sys.argv[1])
          if not Path(str(fasta)+".fai").is_file() or not Path(str(fasta)+".gzi").is_file():
              raise SystemExit("Matching FASTA .fai and .gzi are mandatory")
          contigs=validate_fasta_index_consistency(fasta,Path(str(fasta)+".fai"))
          if not contigs:
              raise SystemExit("Reference contains no indexed contigs")
          print(f"Verified reference index geometry for {len(contigs)} contigs")
          PY
      - name: Run SIRALOOM production VCF processing path
        shell: bash -l {0}
        run: |
          set -euo pipefail
          PROVENANCE="$RUNNER_TEMP/giab-${{ matrix.build }}/asset-provenance.json"
          VCF="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["assets"]["truth_vcf"]["path"])' "$PROVENANCE")"
          FASTA="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["assets"]["reference_fasta"]["path"])' "$PROVENANCE")"
          python scripts/validation/run_vcf_scale_benchmark.py \
            --vcf "$VCF" --reference-fasta "$FASTA" \
            --reference-build "${{ matrix.build }}" \
            --output-dir "$RUNNER_TEMP/giab-${{ matrix.build }}/evidence/scale" \
            --timeout-seconds 14400
      - name: Assemble run provenance
        if: always()
        shell: bash -l {0}
        run: |
          python - "$RUNNER_TEMP/giab-${{ matrix.build }}" "${{ github.sha }}" "${{ matrix.build }}" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path(sys.argv[1]); (root/"evidence").mkdir(parents=True,exist_ok=True)
          data={"schema_version":"1","status":"EVIDENCE_BUNDLE_ASSEMBLED_REVIEW_REQUIRED","generated_at_utc":datetime.now(timezone.utc).isoformat(),"repository":"${{ github.repository }}","repository_commit":sys.argv[2],"reference_build":sys.argv[3],"workflow_run_id":"${{ github.run_id }}","asset_provenance":"asset-provenance.json","benchmark_report":"evidence/scale/vcf-scale-benchmark.json","failure_report":"evidence/scale/vcf-scale-benchmark.failure.json","qualification_boundary":"Public HG001 input-processing evidence only; not independent caller concordance, clinical validation or laboratory qualification."}
          (root/"evidence"/"run-provenance.json").write_text(json.dumps(data,indent=2,sort_keys=True)+"\n")
          PY
      - name: Upload public benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siraloom-giab-hg001-${{ matrix.build }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/giab-${{ matrix.build }}/asset-provenance.json
            ${{ runner.temp }}/giab-${{ matrix.build }}/evidence/**
          if-no-files-found: warn
          retention-days: 90
