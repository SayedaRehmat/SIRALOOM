name: GIAB HG001 reproducible input-processing benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/giab-hg001-qualification.yml"
      - "benchmarks/giab/**"
      - "scripts/validation/acquire_giab_public_assets.py"
      - "scripts/validation/prepare_giab_processing_input.py"
      - "scripts/validation/run_vcf_scale_benchmark.py"
      - "tests/test_giab_public_asset_acquisition.py"
      - "tests/test_giab_processing_derivative.py"
      - "tests/test_vcf_scale_benchmark.py"
  workflow_dispatch:
    inputs:
      reference_build:
        description: "Run one or both reference builds"
        required: true
        type: choice
        options: [BOTH, GRCh38, GRCh37]
        default: BOTH

permissions:
  contents: read

concurrency:
  group: giab-hg001-qualification-${{ github.ref }}-${{ inputs.reference_build || 'BOTH' }}
  cancel-in-progress: false

jobs:
  qualification:
    name: HG001 ${{ matrix.build }} reproducible processing
    if: github.event_name != 'workflow_dispatch' || inputs.reference_build == 'BOTH' || inputs.reference_build == matrix.build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        build: [GRCh38, GRCh37]
    env:
      PYTHONUNBUFFERED: "1"
      SIRALOOM_BENCHMARK_SAMPLE_NAME: HG001
    steps:
      - name: Checkout exact benchmark commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install pinned bioinformatics environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: configs/bioinformatics/bcftools-environment.yml
          environment-name: bcftools
          cache-environment: true
          init-shell: bash
      - name: Install SIRALOOM backend
        shell: bash -l {0}
        run: pip install -e .
      - name: Acquire pinned GIAB VCF, TBI, BED and reference source
        shell: bash -l {0}
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/giab-${{ matrix.build }}"
          mkdir -p "$RUN_DIR"
          python scripts/validation/acquire_giab_public_assets.py \
            --manifest benchmarks/giab/public_assets.v1.json \
            --build "${{ matrix.build }}" \
            --output-dir "$RUN_DIR/assets" \
            --provenance-out "$RUN_DIR/asset-provenance.json"
      - name: Record raw GIAB validation result without changing acceptance policy
        shell: bash -l {0}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/giab-${{ matrix.build }}/asset-provenance.json" "$RUNNER_TEMP/giab-${{ matrix.build }}/evidence/raw-validation.json" <<'PY'
          import json,sys
          from pathlib import Path
          from backend.app.domain.ingestion import validate_vcf
          provenance=Path(sys.argv[1]); out=Path(sys.argv[2])
          data=json.loads(provenance.read_text())
          vcf=Path(data["assets"]["truth_vcf"]["path"])
          result=validate_vcf(vcf)
          payload={
            "status":result.status,
            "file_kind":result.file_kind,
            "record_count":result.record_count,
            "sample_count":len(result.sample_names),
            "detected_build":result.detected_build,
            "error_codes":[result.error_code] if result.error_code else [],
            "errors":result.errors,
            "warnings":result.warnings,
            "metadata":result.metadata,
            "sample_identifiers_recorded":False,
            "interpretation":"This is the unmodified GIAB truth VCF intake result. INVALID is preserved as evidence and is not converted to PASS."
          }
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          print(json.dumps({k:payload[k] for k in ("status","record_count","sample_count","error_codes","errors")},sort_keys=True))
          PY
      - name: Derive eligible processing input and quarantine complete star records
        shell: bash -l {0}
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/giab-${{ matrix.build }}"
          VCF="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["assets"]["truth_vcf"]["path"])' "$RUN_DIR/asset-provenance.json")"
          python scripts/validation/prepare_giab_processing_input.py \
            --source-vcf "$VCF" \
            --output-vcf "$RUN_DIR/eligible-processing-input.vcf" \
            --excluded-records "$RUN_DIR/evidence/quarantined-spanning-deletion-records.jsonl" \
            --provenance-out "$RUN_DIR/evidence/derivative-provenance.json"
      - name: Verify matching reference FASTA, FAI and GZI
        shell: bash -l {0}
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/giab-${{ matrix.build }}"
          FASTA="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["reference_pair"]["fasta"]["path"])' "$RUN_DIR/asset-provenance.json")"
          python - "$FASTA" <<'PY'
          import sys
          from pathlib import Path
          from backend.app.domain.reference_package import validate_fasta_index_consistency
          fasta=Path(sys.argv[1]); fai=Path(str(fasta)+".fai"); gzi=Path(str(fasta)+".gzi")
          if not fai.is_file() or not gzi.is_file():
              raise SystemExit("Matching FASTA .fai and BGZF .gzi are mandatory")
          contigs=validate_fasta_index_consistency(fasta,fai)
          if not contigs:
              raise SystemExit("Reference contains no indexed contigs")
          print(f"FASTA/FAI/GZI present; FAI geometry validated for {len(contigs)} contigs")
          PY
      - name: Execute SIRALOOM validation, reference checks, routing, normalization and CSI reconciliation
        shell: bash -l {0}
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/giab-${{ matrix.build }}"
          FASTA="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["reference_pair"]["fasta"]["path"])' "$RUN_DIR/asset-provenance.json")"
          python scripts/validation/run_vcf_scale_benchmark.py \
            --vcf "$RUN_DIR/eligible-processing-input.vcf" \
            --reference-fasta "$FASTA" \
            --reference-build "${{ matrix.build }}" \
            --output-dir "$RUN_DIR/evidence/scale" \
            --timeout-seconds 14400
      - name: Assemble run provenance
        if: always()
        shell: bash -l {0}
        run: |
          python - "$RUNNER_TEMP/giab-${{ matrix.build }}" "${{ github.sha }}" "${{ matrix.build }}" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path(sys.argv[1]); evidence=root/"evidence"; evidence.mkdir(parents=True,exist_ok=True)
          payload={
            "schema_version":"1",
            "generated_at_utc":datetime.now(timezone.utc).isoformat(),
            "repository":"${{ github.repository }}",
            "repository_commit":sys.argv[2],
            "workflow_run_id":"${{ github.run_id }}",
            "workflow_attempt":"${{ github.run_attempt }}",
            "reference_build":sys.argv[3],
            "asset_provenance":"asset-provenance.json",
            "raw_validation":"evidence/raw-validation.json",
            "derivative_provenance":"evidence/derivative-provenance.json",
            "processing_report":"evidence/scale/vcf-scale-benchmark.json",
            "processing_failure":"evidence/scale/vcf-scale-benchmark.failure.json",
            "qualification_boundary":"Public HG001 input-processing evidence only; the eligible derivative excludes whole star-containing records and is not the complete truth VCF; this is not caller concordance, clinical validation or laboratory qualification."
          }
          (evidence/"run-provenance.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          PY
      - name: Preserve per-build benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siraloom-giab-hg001-${{ matrix.build }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/giab-${{ matrix.build }}/asset-provenance.json
            ${{ runner.temp }}/giab-${{ matrix.build }}/evidence/**
          if-no-files-found: warn
          retention-days: 90
