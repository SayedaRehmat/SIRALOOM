name: Temporary clinical interoperability lock refresh

on:
  pull_request:
    paths:
      - "tools/lock-refresh/request.txt"
      - ".github/workflows/refresh-clinical-interop-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/clinical-phenotype-pedigree-inheritance-qualification-20261107'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install repository-pinned uv
        run: python -m pip install --disable-pip-version-check --no-deps "uv==0.10.0"
      - name: Resolve and write the lockfile
        run: |
          set -euo pipefail
          uv --version
          uv lock
          uv lock --check
      - name: Commit only the generated lockfile to this feature branch
        env:
          BRANCH: feature/clinical-phenotype-pedigree-inheritance-qualification-20261107
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock already current"
            exit 0
          fi
          git commit -m "build: update pinned Python dependency lock"
          git push origin "HEAD:refs/heads/${BRANCH}"
