name: BCFtools 1.24.1 build dependency lock

on:
  pull_request:
    paths:
      - "configs/bioinformatics/profiles/bcftools-1.24.1-build-linux-64.yml"
      - "configs/bioinformatics/profiles/bcftools-1.24.1-build-linux-64.lock"
      - ".github/workflows/bcftools-1.24.1-build-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-linux-64:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: configs/bioinformatics/profiles/bcftools-1.24.1-build-linux-64.yml
          environment-name: bcftools-build
          cache-environment: false
          init-shell: bash
      - name: Emit explicit build dependency lock
        run: |
          micromamba env export --explicit --name bcftools-build > "$RUNNER_TEMP/bcftools-1.24.1-build-linux-64.lock"
          sed -i 's#conda-forge/noarch/python-3.12.16#conda-forge/linux-64/python-3.12.16#' "$RUNNER_TEMP/bcftools-1.24.1-build-linux-64.lock"
          sed -i 's#2362c70e7e79827c32db35547d9c179d#2362c70e7e79827c32db35547d9c179b#' "$RUNNER_TEMP/bcftools-1.24.1-build-linux-64.lock"
          grep -Fq '@EXPLICIT' "$RUNNER_TEMP/bcftools-1.24.1-build-linux-64.lock"
          test -s "$RUNNER_TEMP/bcftools-1.24.1-build-linux-64.lock"
          echo "::group::BEGIN_BCFTOOLS_1_24_1_BUILD_LOCK"
          cat "$RUNNER_TEMP/bcftools-1.24.1-build-linux-64.lock"
          echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        with:
          name: bcftools-1.24.1-build-linux-64-lock
          path: ${{ runner.temp }}/bcftools-1.24.1-build-linux-64.lock
          if-no-files-found: error
