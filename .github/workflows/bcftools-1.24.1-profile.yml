name: BCFtools 1.24.1 source profile qualification

on:
  pull_request:
    paths:
      - "scripts/build_bcftools_1_24_1.sh"
      - "configs/bioinformatics/profiles/bcftools-1.24.1-build-linux-64.lock"
      - "tests/test_vcf_tools.py"
      - "tests/test_toolchain_profiles.py"
      - "tests/test_bcftools_normalization.py"
      - "tests/test_csi_index_integrity.py"
      - "tests/test_giab_benchmark_runner.py"
      - "tests/test_ingestion.py"
      - "tests/test_unsupported_vcf_worker_routing.py"
      - ".github/workflows/bcftools-1.24.1-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build-linux-64:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: configs/bioinformatics/profiles/bcftools-1.24.1-build-linux-64.lock
          environment-name: bcftools-build
          cache-environment: false
          init-shell: bash
      - name: Generate explicit build dependency lock
        run: |
          micromamba env export --explicit --name bcftools-build > "$RUNNER_TEMP/bcftools-1.24.1-build-linux-64.lock"
          grep -Fq '@EXPLICIT' "$RUNNER_TEMP/bcftools-1.24.1-build-linux-64.lock"
          test -s "$RUNNER_TEMP/bcftools-1.24.1-build-linux-64.lock"
          diff -u configs/bioinformatics/profiles/bcftools-1.24.1-build-linux-64.lock "$RUNNER_TEMP/bcftools-1.24.1-build-linux-64.lock"
          echo "::group::BEGIN_BCFTOOLS_1_24_1_BUILD_LOCK"
          cat "$RUNNER_TEMP/bcftools-1.24.1-build-linux-64.lock"
          echo "::endgroup::"
      - name: Build source archives with SHA-256 verification
        env:
          BCFTOOLS_PREFIX: ${{ env.MAMBA_ROOT_PREFIX }}/envs/bcftools-build
        run: bash scripts/build_bcftools_1_24_1.sh
      - name: Run normalization, multiallelic, BGZF and CSI regression smoke tests
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/bcftools-profile-smoke"
          mkdir -p "$work"
          cat > "$work/ref.fa" <<'EOF'
          >chr1
          AAAAAAAAAACCCCCCCCCCGGGGGGGGGGTTTTTTTTTT
          EOF
          printf "chr1\\t40\\t6\\t40\\t41\\n" > "$work/ref.fa.fai"
          cat > "$work/input.vcf" <<'EOF'
          ##fileformat=VCFv4.2
          ##contig=<ID=chr1,length=40>
          #CHROM	POS	ID	REF	ALT	QUAL	FILTER	INFO
          chr1	11	.	C	CA,CAA	50	PASS	.
          EOF
          "$MAMBA_ROOT_PREFIX/envs/bcftools-build/bin/bcftools" norm -f "$work/ref.fa" -m -any -Oz -o "$work/normalized.vcf.gz" "$work/input.vcf"
          "$MAMBA_ROOT_PREFIX/envs/bcftools-build/bin/bcftools" index --csi "$work/normalized.vcf.gz"
          "$MAMBA_ROOT_PREFIX/envs/bcftools-build/bin/bcftools" view -H "$work/normalized.vcf.gz" | grep -q $'chr1\t11'
          test -s "$work/normalized.vcf.gz.csi"
          "$MAMBA_ROOT_PREFIX/envs/bcftools-build/bin/bcftools" --version
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Run backend regression suite against BCFtools 1.24.1
        env:
          BCFTOOLS_EXECUTABLE: ${{ env.MAMBA_ROOT_PREFIX }}/envs/bcftools-build/bin/bcftools
          BCFTOOLS_PROFILE_ID: bcftools-1.24.1-htslib-1.24.1-linux-64-source
          BCFTOOLS_VERSION: "1.24.1"
          HTSLIB_VERSION: "1.24.1"
          DATABASE_URL: sqlite:///./ci-bcftools-1.24.1.db
          REDIS_URL: redis://localhost:6379/0
          GENEBE_ENABLED: "false"
          GNOMAD_ENABLED: "false"
          FIREBASE_AUTH_REQUIRED: "false"
        run: |
          python -m pip install --disable-pip-version-check --no-deps "uv==0.10.0"
          uv lock --check
          uv sync --locked --extra dev
          uv run --locked pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: bcftools-1.24.1-build-linux-64-lock
          path: ${{ runner.temp }}/bcftools-1.24.1-build-linux-64.lock
          if-no-files-found: error
