name: Python dependency lock verification

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python-lock-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned uv lock manager
        run: python -m pip install --disable-pip-version-check --no-deps "uv==0.10.0"
      - name: Verify lock metadata and install exact development environment
        env:
          UV_NO_PROGRESS: "1"
          UV_PYTHON_DOWNLOADS: "never"
        run: |
          uv --version
          uv lock --check
          uv sync --locked --extra dev
      - name: Verify runtime Redis client and Kombu transport compatibility
        run: |
          uv run --locked python - <<'PY'
          import redis
          import kombu
          import kombu.transport.redis

          print(f"redis-py={redis.__version__}")
          print(f"kombu={kombu.__version__}")
          PY
      - name: Verify backend import and lock immutability
        run: |
          uv run --locked python -c "import backend.app; print('backend import OK')"
          uv lock --check
