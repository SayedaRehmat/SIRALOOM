name: Python dependency lock bootstrap

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - ".python-version"
      - ".github/workflows/python-lock-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: false
      - name: Install pinned uv lock manager
        run: python -m pip install --disable-pip-version-check --no-deps "uv==0.10.0"
      - name: Resolve complete cross-platform dependency lock
        env:
          UV_NO_PROGRESS: "1"
          UV_PYTHON_DOWNLOADS: "never"
        run: |
          uv --version
          uv lock --python 3.12
          uv lock --check
      - name: Install exactly from the resolved lock
        env:
          UV_NO_PROGRESS: "1"
          UV_PYTHON_DOWNLOADS: "never"
        run: uv sync --locked --extra dev
      - name: Verify runtime Redis client compatibility with Kombu
        run: |
          uv run --locked python - <<'PY'
          import redis
          from kombu.transport.redis import Channel

          assert redis.VERSION >= (6, 1, 0), (
              f"redis-py {redis.__version__} is below Kombu's required 6.1.0"
          )
          print(f"redis-py={redis.__version__}")
          print(f"kombu={__import__('kombu').__version__}")
          PY
      - name: Verify project imports and lock consistency
        run: |
          uv run --locked python -c "import backend.app; print('backend import OK')"
          uv lock --check
      - name: Emit lockfile for initial repository bootstrap
        run: |
          test -s uv.lock
          echo "::group::BEGIN_UV_LOCKFILE"
          cat uv.lock
          echo "::endgroup::"
