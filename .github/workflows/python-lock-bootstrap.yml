name: Python dependency lock verification

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python-lock-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned uv lock manager
        run: python -m pip install --disable-pip-version-check --no-deps "uv==0.10.0"
      - name: Verify lock metadata and production-only dependency graph
        env:
          UV_NO_PROGRESS: "1"
          UV_PYTHON_DOWNLOADS: "never"
        run: |
          uv --version
          uv lock --check
          uv sync --locked --no-dev
          uv run --locked --no-dev python -c "import redis, kombu.transport.redis, backend.app; print('production imports OK')"
      - name: Verify development dependency graph
        run: |
          uv sync --locked --extra dev
          uv run --locked python -c "import pytest, redis, kombu.transport.redis; print('development imports OK')"
      - name: Verify lock immutability
        run: uv lock --check
