services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: siraloom
      POSTGRES_USER: siraloom
      POSTGRES_PASSWORD: siraloom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siraloom -d siraloom"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - artifact_data:/data/siraloom/artifacts

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: celery -A backend.app.infrastructure.queue.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - artifact_data:/data/siraloom/artifacts

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_SIRALOOM_API_BASE: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  artifact_data:
  frontend_node_modules:
