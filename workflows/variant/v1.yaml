id: variant-v1
version: "2.1"
input:
  type: VCF
steps:
  - id: validate_input
    type: python
    provenance_required: true
  - id: normalize
    type: boundary
    provenance_required: true
    mode: validated-reference-package-boundary
  - id: annotate
    type: provider
    providers: [genebe]
    provenance_required: true
  - id: population
    type: population-engine
    provenance_required: true
  - id: build_evidence
    type: evidence-engine
    provenance_required: true
  - id: acmg_assessment
    type: acmg
    provenance_required: true
  - id: review
    type: human-review
    provenance_required: true
  - id: reportability
    type: human-review
    provenance_required: true
  - id: report
    type: reporting
    provenance_required: true
  - id: export_provenance
    type: export
    provenance_required: true
reanalysis:
  enabled: true
  model: immutable-child-analysis
  preserve_parent_analysis: true
  triggers:
    - MANUAL
    - ANNOTATION_UPDATE
    - POPULATION_UPDATE
    - EVIDENCE_UPDATE
    - ACMG_RULE_UPDATE
    - PHENOTYPE_UPDATE
    - BIOINFORMATICS_UPDATE
    - REFERENCE_UPDATE
    - PERIODIC
  change_detection: version-and-checksum-aware
  notification_required: true
  idempotent_candidate_detection: true
  dependency_aware_reuse: true
  human_review_required_for_interpretation_change: true
failure_policy:
  durable_state: true
  retry_failed_step: true
  do_not_restart_completed_steps: true
